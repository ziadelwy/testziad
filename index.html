<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قيد الدومينوز والبلوت</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#111827',
              darker: '#030712',
              card: '#1f2937'
            }
          }
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      overscroll-behavior-y: contain; /* يمنع السحب المطاطي للصفحة */
    }
    button, input, div {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 999px;
    }
    @keyframes float {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #f59e0b;
      border-radius: 2px;
      top: -20px;
      animation: float 3s linear forwards;
      z-index: 100;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-brand-darker text-slate-800 dark:text-white transition-colors duration-300 h-[100dvh] flex flex-col overflow-hidden">

  <div class="flex-1 flex flex-col max-w-md mx-auto w-full h-full relative px-3 py-2 sm:px-4 sm:py-3 justify-between">
    
    <!-- Header -->
    <header class="flex justify-between items-center py-1 sm:py-2 shrink-0">
      <div class="flex items-center gap-2">
        <h1 class="text-xl sm:text-2xl font-black tracking-wide text-slate-800 dark:text-white" id="headerTitle">سجل الدومينوز</h1>
      </div>
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="themeToggle" class="p-2 sm:p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-amber-400 hover:scale-105 active:scale-95 transition-all shadow-sm" aria-label="تغيير المظهر">
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
          <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <button id="settingsBtn" class="p-2 sm:p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-white hover:scale-105 active:scale-95 transition-all shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>

    <!-- Scoreboard -->

      <div class="flex justify-between items-center mb-3 text-[11px] sm:text-xs font-bold text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-slate-700 pb-2">
        <span id="activeModeBadge" class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400">فردي (1v1)</span>
        <span id="activeTargetBadge" class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-amber-400">الهدف: 151</span>

      <div class="grid grid-cols-2 gap-3 mt-4">
        <button id="undoBtn" class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800/60 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs sm:text-sm font-bold transition-all active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>

        <button id="newGameBtn" class="flex items-center justify-center gap-1.5 py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800/60 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs sm:text-sm font-bold transition-all active:scale-95">

    <!-- Inputs & Submit Button -->

        </div>
      </div>
    </section>

    <!-- Touch Numpad -->
    <section class="mt-2 shrink-0">
      <!-- Quick Adds -->
      <div class="grid grid-cols-4 gap-2 mb-2">
        <button onclick="addQuickScore(5)" class="py-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-500 font-bold text-sm active:bg-amber-100 dark:active:bg-amber-500/20 transition-colors">+5</button>
        <button onclick="addQuickScore(10)" class="py-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-500 font-bold text-sm active:bg-amber-100 dark:active:bg-amber-500/20 transition-colors">+10</button>
        <button onclick="addQuickScore(20)" class="py-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-500 font-bold text-sm active:bg-amber-100 dark:active:bg-amber-500/20 transition-colors">+20</button>
        <button onclick="addQuickScore(50)" class="py-1.5 rounded-lg bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-500 font-bold text-sm active:bg-amber-100 dark:active:bg-amber-500/20 transition-colors">+50</button>
      </div>
      
      <!-- Keypad -->

        <div class="grid grid-cols-3 gap-1.5 sm:gap-2">

          <button onclick="pressKey('4')" class="h-10 sm:h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white font-bold text-lg active:scale-95 transition-all">4</button>
          <button onclick="pressKey('5')" class="h-10 sm:h-12 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-white font-bold text-lg active:scale-95 transition-all">5</button>

          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white dark:bg-brand-darker rounded-t-[32px] w-full max-w-md p-5 sm:p-6 space-y-4 sm:space-y-5 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">

        <button id="closeSettings" class="p-1 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">

      <div class="space-y-2">

        <div class="grid grid-cols-2 gap-3">

      </div>

      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-600 dark:text-slate-400">أسماء الفرق/اللاعبين:</label>

          <!-- Dynamically generated -->
        </div>
      </div>

      <button id="applySettingsBtn" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-base shadow-lg shadow-amber-500/20 transition-all active:scale-95">
        حفظ وبدء لعبة جديدة
      </button>
    </div>
  </div>

  <!-- Confirm Reset Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 px-4">
    <div class="bg-white dark:bg-brand-darker rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl text-center transform scale-95 transition-transform duration-300 border border-slate-200 dark:border-slate-800">
      <div class="w-14 h-14 rounded-full bg-rose-100 dark:bg-rose-500/10 text-rose-600 dark:text-rose-500 flex items-center justify-center mx-auto">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </div>
      <div>
        <h4 class="text-lg font-black text-slate-800 dark:text-white">خيارات تصفير اللعبة</h4>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">ما الذي ترغب في مسحه للبدء من جديد؟</p>
      </div>
      <div class="flex flex-col gap-2 pt-2">
        <button onclick="confirmReset('round')" class="w-full py-3 rounded-xl bg-slate-800 text-white dark:bg-slate-200 dark:text-slate-900 text-sm font-bold transition-all active:scale-95">
          مسح نقاط الجولة فقط (الاحتفاظ بالانتصارات)
        </button>
        <button onclick="confirmReset('all')" class="w-full py-3 rounded-xl bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-500 text-sm font-bold transition-all active:scale-95 border border-rose-200 dark:border-rose-900/50">
          مسح كل شيء (الجولة والانتصارات)
        </button>
        <button onclick="confirmReset('cancel')" class="w-full py-3 rounded-xl text-slate-600 dark:text-slate-400 text-sm font-bold transition-all active:scale-95 hover:bg-slate-100 dark:hover:bg-slate-800">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <!-- Winner Modal -->
  <div id="winnerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 px-4 overflow-hidden">
    <div id="confettiContainer" class="absolute inset-0 pointer-events-none"></div>
    <div class="bg-white dark:bg-brand-darker border-4 border-amber-400 rounded-3xl w-full max-w-sm p-6 text-center shadow-[0_0_50px_rgba(245,158,11,0.3)] relative z-10 transform scale-95 transition-transform duration-300 space-y-4">
      <div class="w-24 h-24 rounded-full bg-amber-50 dark:bg-amber-500/20 flex items-center justify-center mx-auto border-4 border-amber-400 shadow-inner">
        <span class="text-5xl">🏆</span>
      </div>
      <div>
        <h2 class="text-amber-500 font-black text-3xl mb-1">انتهت اللعبة!</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm font-bold" id="winningReason">الوصول للهدف</p>
      </div>
      
      <div class="bg-slate-50 dark:bg-slate-900 rounded-2xl p-4 border border-slate-200 dark:border-slate-800">
        <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">الفريق الفائز</p>
        <p id="winnerAnnounceText" class="text-2xl font-black text-slate-800 dark:text-white"></p>
      </div>

      <button onclick="closeWinnerModalAndReset()" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-base transition-all active:scale-95 shadow-lg shadow-amber-500/20">
        بدء جولة جديدة
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toastMessage" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white dark:bg-white dark:text-slate-900 text-xs sm:text-sm font-bold px-5 py-3 rounded-full shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-[60] flex items-center gap-2">
    <span id="toastText"></span>
  </div>

  <script>
    let state = {
      theme: 'dark',
      mode: '2v2',
      target: 151,
      names: {
        teamA: 'لنا',
        teamB: 'لهم',
        teamC: 'اللاعب ٣'
      },
      scores: {
        teamA: 0,
        teamB: 0,
        teamC: 0
      },
      gamesWon: {
        teamA: 0,
        teamB: 0,
        teamC: 0
      },
      history: [],
      activeInput: 'teamA'
    };

    let currentInputs = {
      teamA: '',
      teamB: '',
      teamC: ''
    };

    window.addEventListener('load', () => {
      loadFromLocalStorage();
      applyTheme();
      renderScoreboard();
      renderInputs();
      renderHistory();
      setupEventListeners();
      registerServiceWorker();
    });

    function loadFromLocalStorage() {
      const savedState = localStorage.getItem('dominoes_v2_state');
      if (savedState) {
        try {
          const parsed = JSON.parse(savedState);
          state = { ...state, ...parsed };
          // Ensure gamesWon exists if loaded from old version
          if(!state.gamesWon) state.gamesWon = { teamA: 0, teamB: 0, teamC: 0 };
        } catch (e) {
          console.error("Failed to load local storage:", e);
        }
      }
      state.activeInput = 'teamA';
    }

    function saveToLocalStorage() {
      localStorage.setItem('dominoes_v2_state', JSON.stringify(state));
    }

    function applyTheme() {
      const html = document.documentElement;
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');
      
      if (state.theme === 'light') {
        html.classList.remove('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
      } else {
        html.classList.add('dark');
        moonIcon.classList.remove('hidden');
        sunIcon.classList.add('hidden');
      }
    }

    function setupEventListeners() {
      document.getElementById('themeToggle').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        saveToLocalStorage();
      });

      document.getElementById('settingsBtn').addEventListener('click', openSettings);
      document.getElementById('closeSettings').addEventListener('click', closeSettings);
      document.getElementById('applySettingsBtn').addEventListener('click', applySettings);
      document.getElementById('submitBtn').addEventListener('click', submitRound);
      document.getElementById('undoBtn').addEventListener('click', undoLastRound);
      document.getElementById('newGameBtn').addEventListener('click', () => showModal('confirmModal'));
    }

    function renderScoreboard() {
      const grid = document.getElementById('scoresGrid');
      grid.innerHTML = '';

      const modeText = state.mode === '1v1' ? 'فردي (1v1)' : state.mode === '2v2' ? 'زوجي (2v2)' : 'ثلاثي (1v1v1)';
      document.getElementById('activeModeBadge').textContent = modeText;
      document.getElementById('activeTargetBadge').textContent = `الهدف: ${state.target}`;

      const parties = getActiveParties();
      parties.forEach(party => {
        const name = state.names[party] || 'فريق';
        const score = state.scores[party] || 0;
        const wins = state.gamesWon[party] || 0;
        const progressPercentage = Math.min((score / state.target) * 100, 100);

        const card = document.createElement('div');
        card.className = "flex flex-col items-center justify-center p-2 text-center relative transition-all duration-300";
        card.innerHTML = `
          <div class="flex flex-col items-center mb-1">
            <span class="text-sm font-black text-slate-600 dark:text-slate-300 max-w-[120px] truncate">${name}</span>
            <div class="flex items-center gap-1 text-[10px] text-amber-600 dark:text-amber-500 bg-amber-50 dark:bg-amber-500/10 px-2 py-0.5 rounded-full mt-0.5 border border-amber-200 dark:border-amber-500/20">
              <span>🏆</span> <span class="font-bold">${wins}</span>
            </div>
          </div>
          <span class="text-5xl font-black text-slate-800 dark:text-white tracking-tighter mt-1 transition-all duration-300">${score}</span>
          <div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full mt-3 overflow-hidden shadow-inner">
            <div class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: ${progressPercentage}%"></div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (state.mode === '1v1v1') {
        grid.className = "grid grid-cols-3 gap-2 divide-x divide-x-reverse divide-slate-200 dark:divide-slate-700";
      } else {
        grid.className = "grid grid-cols-2 gap-4 divide-x divide-x-reverse divide-slate-200 dark:divide-slate-700";
      }
    }

    function renderInputs() {
      const container = document.getElementById('inputsContainer');
      container.innerHTML = '';
      const parties = getActiveParties();

      parties.forEach(party => {
        const name = state.names[party];
        const val = currentInputs[party];
        const isActive = state.activeInput === party;

        const inputWrapper = document.createElement('div');
        inputWrapper.className = `flex-1 flex flex-col items-center transition-all duration-200`;
        inputWrapper.innerHTML = `
          <span class="text-xs font-bold text-slate-500 dark:text-slate-400 mb-1 max-w-[80px] truncate">${name}</span>
          <div onclick="setActiveInput('${party}')" class="w-full h-12 sm:h-14 flex items-center justify-center rounded-2xl border-2 text-center font-black text-xl cursor-pointer transition-all ${
            isActive 
            ? 'bg-amber-50 dark:bg-amber-500/10 border-amber-400 text-amber-600 dark:text-amber-400 scale-105 shadow-md' 
            : 'bg-white dark:bg-brand-card border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'
          }">
            ${val || '<span class="text-slate-300 dark:text-slate-600 font-normal">0</span>'}
          </div>
        `;
        container.appendChild(inputWrapper);
      });
    }

    function renderHistory() {
      const log = document.getElementById('historyLog');
      const emptyMsg = document.getElementById('emptyHistoryMsg');
      
      log.innerHTML = '';

      if (state.history.length === 0) {
        emptyMsg.classList.remove('hidden');
        log.appendChild(emptyMsg);
        return;
      } else {
        emptyMsg.classList.add('hidden');
      }

      state.history.forEach((round, index) => {
        const parties = getActiveParties();
        const roundRow = document.createElement('div');
        roundRow.className = "flex items-center justify-between py-2 px-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-800 text-xs sm:text-sm";
        
        let roundValuesHtml = '';
        parties.forEach((party) => {
          const val = round[party] || 0;
          roundValuesHtml += `
            <div class="flex items-center gap-1.5 px-2 w-full justify-center">
              <span class="text-slate-400 dark:text-slate-500 font-bold">${state.names[party].substring(0,6)}:</span>
              <span class="font-black ${val > 0 ? 'text-amber-500' : 'text-slate-600 dark:text-slate-400'}">${val}</span>
            </div>
          `;
        });

        roundRow.innerHTML = `
          <div class="flex items-center justify-center w-6 shrink-0">
            <span class="text-[10px] font-black text-slate-400 dark:text-slate-500">#${index + 1}</span>
          </div>
          <div class="flex-1 flex justify-around divide-x divide-x-reverse divide-slate-200 dark:divide-slate-700">
            ${roundValuesHtml}
          </div>
        `;
        log.appendChild(roundRow);
      });

      setTimeout(() => {
        log.scrollTop = log.scrollHeight;
      }, 50);
    }

    function getActiveParties() {
      return (state.mode === '1v1v1') ? ['teamA', 'teamB', 'teamC'] : ['teamA', 'teamB'];
    }

    function setActiveInput(party) {
      state.activeInput = party;
      renderInputs();
    }

    function pressKey(key) {
      const active = state.activeInput;
      if (!active) return;

      if (key === 'Backspace') {
        currentInputs[active] = currentInputs[active].slice(0, -1);
      } else if (key === 'C') {
        currentInputs[active] = '';
      } else {
        if (currentInputs[active].length < 3) {
          if (currentInputs[active] === '0' && key === '0') return;
          if (currentInputs[active] === '0') currentInputs[active] = '';
          currentInputs[active] += key;
        }
      }
      renderInputs();
    }

    function addQuickScore(amount) {
      const active = state.activeInput;
      if (!active) return;
      const currentVal = parseInt(currentInputs[active]) || 0;
      currentInputs[active] = Math.min(999, currentVal + amount).toString();
      renderInputs();
    }

    function submitRound() {
      const parties = getActiveParties();
      const roundData = {};
      let hasValue = false;

      parties.forEach(party => {
        const val = parseInt(currentInputs[party]) || 0;
        roundData[party] = val;
        if (val > 0) hasValue = true;
      });

      if (!hasValue) {
        showToast("يرجى إدخال النقاط لأحد الأطراف على الأقل!");
        return;
      }

      parties.forEach(party => {
        state.scores[party] = (state.scores[party] || 0) + roundData[party];
      });

      state.history.push(roundData);
      clearInputs();
      saveToLocalStorage();
      
      renderScoreboard();
      renderInputs();
      renderHistory();

      checkGameWinner();
    }

    function clearInputs() {
      currentInputs = { teamA: '', teamB: '', teamC: '' };
      state.activeInput = 'teamA';
    }

    function undoLastRound() {
      if (state.history.length === 0) {
        showToast("لا توجد جولات للتراجع عنها!");
        return;
      }
      const lastRound = state.history.pop();
      getActiveParties().forEach(party => {
        state.scores[party] = Math.max(0, (state.scores[party] || 0) - (lastRound[party] || 0));
      });

      saveToLocalStorage();
      renderScoreboard();
      renderInputs();
      renderHistory();
      showToast("تم التراجع عن الجولة الأخيرة بنجاح!");
    }

    function checkGameWinner() {
      const parties = getActiveParties();
      const target = state.target;

      // Rule 1: Skab Rule (If target is 151, and one exceeds/reaches 101 while others are 0)
      if (target === 151) {
        for (let party of parties) {
          if (state.scores[party] >= 101) {
            // Check if all OTHER parties are strictly 0
            const othersAreZero = parties.every(other => other === party || state.scores[other] === 0);
            if (othersAreZero) {
              triggerWinner(party, "الفوز بقاعدة السكب (تخطي 101 والخصوم صفر)!");
              return;
            }
          }
        }
      }

      // Rule 2: Normal Target Rule
      for (let party of parties) {
        if (state.scores[party] >= target) {
          const maxScore = Math.max(...parties.map(p => state.scores[p]));
          const leaders = parties.filter(p => state.scores[p] === maxScore);
          
          if (leaders.length === 1 && leaders[0] === party) {
            triggerWinner(party, `تخطي الهدف المطلوب (${maxScore} نقطة)`);
            return;
          } else if (leaders.length > 1) {
            showToast("تعادل في النقاط! استمروا باللعب لكسر التعادل.");
            return;
          }
        }
      }
    }

    function triggerWinner(winnerParty, reason) {
      // Increment Match Wins
      state.gamesWon[winnerParty] = (state.gamesWon[winnerParty] || 0) + 1;
      saveToLocalStorage();

      document.getElementById('winnerAnnounceText').textContent = state.names[winnerParty];
      document.getElementById('winningReason').textContent = reason;

      startConfetti();
      showModal('winnerModal');
      
      // Update scoreboard behind modal to show new crown count instantly
      renderScoreboard(); 
    }

    function startConfetti() {
      const container = document.getElementById('confettiContainer');
      container.innerHTML = '';
      const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444', '#ffffff'];

      for (let i = 0; i < 60; i++) {
        const conf = document.createElement('div');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.animationDelay = Math.random() * 1 + 's';
        conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
        container.appendChild(conf);
      }
    }

    function closeWinnerModalAndReset() {
      hideModal('winnerModal');
      // Reset scores and history, but keep gamesWon
      getActiveParties().forEach(p => state.scores[p] = 0);
      state.history = [];
      clearInputs();
      saveToLocalStorage();
      renderScoreboard();
      renderInputs();
      renderHistory();
    }

    function confirmReset(action) {
      hideModal('confirmModal');
      if (action === 'cancel') return;

      if (action === 'all') {
        state.gamesWon = { teamA: 0, teamB: 0, teamC: 0 };
        showToast("تم تصفير اللعبة وعداد الانتصارات بالكامل!");
      } else if (action === 'round') {
        showToast("تم تصفير نقاط الجولة فقط!");
      }

      getActiveParties().forEach(p => state.scores[p] = 0);
      state.history = [];
      clearInputs();
      saveToLocalStorage();
      
      renderScoreboard();
      renderInputs();
      renderHistory();
    }

    function openSettings() {
      updateSettingsUI();
      showModal('settingsModal');
    }

    function closeSettings() {
      hideModal('settingsModal');
    }

    function updateSettingsUI() {
      ['1v1', '2v2', '1v1v1'].forEach(m => {
        const btn = document.getElementById(`btnMode${m}`);
        if (state.mode === m) {
          btn.className = "py-2.5 rounded-xl border border-amber-400 bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 font-black text-sm transition-all";
        } else {
          btn.className = "py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-brand-card text-slate-600 dark:text-slate-400 font-bold text-sm transition-all";
        }
      });

      [101, 151].forEach(t => {
        const btn = document.getElementById(`btnTarget${t}`);
        if (state.target === t) {
          btn.className = "py-2.5 rounded-xl border border-amber-400 bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 font-black text-sm transition-all";
        } else {
          btn.className = "py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-brand-card text-slate-600 dark:text-slate-400 font-bold text-sm transition-all";
        }
      });

      renderNamesInputs();
    }

    function setGameMode(mode) {
      state.mode = mode;
      // Default Names logic
      if (mode === '1v1' || mode === '2v2') {
        if(state.names.teamA === 'اللاعب ١' || state.names.teamA === 'فريقنا') state.names.teamA = 'لنا';
        if(state.names.teamB === 'اللاعب ٢' || state.names.teamB === 'فريقهم') state.names.teamB = 'لهم';
      }
      updateSettingsUI();
    }

    function setTargetScore(target) {
      state.target = target;
      updateSettingsUI();
    }

    function renderNamesInputs() {
      const container = document.getElementById('namesInputContainer');
      container.innerHTML = '';
      getActiveParties().forEach(party => {
        const labelText = party === 'teamA' ? 'الطرف الأول:' : party === 'teamB' ? 'الطرف الثاني:' : 'الطرف الثالث:';
        const currentName = state.names[party] || '';
        const inputGroup = document.createElement('div');
        inputGroup.className = "flex flex-col gap-1";
        inputGroup.innerHTML = `
          <span class="text-[11px] font-bold text-slate-500 dark:text-slate-400">${labelText}</span>
          <input type="text" id="inputName_${party}" value="${currentName}" maxLength="12" class="w-full py-2 px-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-sm font-black text-slate-800 dark:text-white focus:outline-none focus:border-amber-400" placeholder="الاسم...">
        `;
        container.appendChild(inputGroup);
      });
    }

    function applySettings() {
      getActiveParties().forEach(party => {
        const inputEl = document.getElementById(`inputName_${party}`);
        if (inputEl && inputEl.value.trim() !== '') {
          state.names[party] = inputEl.value.trim();
        } else {
          state.names[party] = party === 'teamA' ? 'لنا' : party === 'teamB' ? 'لهم' : 'اللاعب ٣';
        }
      });

      closeSettings();
      // Reset round scores and history on new settings, but KEEP gamesWon counter intact unless explicitly cleared
      getActiveParties().forEach(party => state.scores[party] = 0);
      state.history = [];
      clearInputs();
      saveToLocalStorage();
      
      renderScoreboard();
      renderInputs();
      renderHistory();
      showToast("تم حفظ الإعدادات وبدء جولة جديدة!");
    }

    function showModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        const child = modal.firstElementChild;
        child.classList.remove('translate-y-full', 'scale-95');
      }, 50);
    }

    function hideModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.add('opacity-0');
      const child = modal.firstElementChild;
      child.classList.add('translate-y-full', 'scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toastMessage');
      const text = document.getElementById('toastText');
      clearTimeout(toastTimer);
      text.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swCode = `
            const CACHE_NAME = 'dominoes-v2';
            self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['/']))));
            self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
          `;
          const blob = new Blob([swCode], { type: 'text/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        });
      }
    }
  </script>
</body>
</html>
